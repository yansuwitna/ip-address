<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
      // Only inject manifest tag if the initial path is /admin/users
      if (window.location.pathname.replace(/\/+$/, '') === '/admin/users') {
        const m = document.createElement('link');
        m.rel = 'manifest';
        m.href = '/manifest.json';
        document.head.appendChild(m);
      }
    </script>
    <link rel="apple-touch-icon" href="/logo192.png">
    <title>IP & DNS - Manajemen Jaringan, IP Host & DNS Server</title>
    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="font-poppins bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        window.deferredPrompt = e;
        const currentPath = window.location.pathname.replace(/\/+$/, '') || '/';
        // Hanya tampilkan icon install di omnibox (bilah URL) jika sedang di halaman /admin/users
        if (currentPath === '/admin/users') {
          // Jangan preventDefault agar browser memunculkan icon install di address bar
        } else {
          e.preventDefault();
        }
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: e }));
      });
      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
