<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Green Gradient (Bright & Clear Green, not dark/black) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Server Rack Plate Fill -->
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Glowing Yellow/Lime -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#bef264" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Vibrant Green Container -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="109" ry="109" fill="none" stroke="#a7f3d0" stroke-opacity="0.6" stroke-width="4" />

  <!-- Background Tech Lines (Crisp White/Mint) -->
  <path d="M 60 170 H 452 M 60 256 H 452 M 60 342 H 452 M 170 60 V 452 M 256 60 V 452 M 342 60 V 452" 
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5" stroke-dasharray="10 10" />

  <!-- Outer Network Constellation Halo -->
  <g opacity="0.95">
    <circle cx="95" cy="115" r="11" fill="#ffffff" filter="url(#glow)" />
    <circle cx="417" cy="115" r="10" fill="#dcfce7" />
    <circle cx="85" cy="380" r="10" fill="#dcfce7" />
    <circle cx="425" cy="375" r="11" fill="#ffffff" filter="url(#glow)" />
    
    <!-- Connection lines -->
    <path d="M 95 115 L 140 160 M 417 115 L 370 160 M 85 380 L 150 340 M 425 375 L 360 340" 
          stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.45" stroke-linecap="round" />
  </g>

  <!-- Server Stack Illustration -->
  <!-- Unit 1: Top Server Rack -->
  <g filter="url(#shadow)">
    <rect x="110" y="130" width="292" height="66" rx="14" fill="#ffffff" />
    <line x1="138" y1="154" x2="250" y2="154" stroke="#059669" stroke-width="5" stroke-linecap="round" />
    <line x1="138" y1="172" x2="210" y2="172" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <circle cx="345" cy="163" r="7" fill="#10b981" filter="url(#glow)" />
    <circle cx="372" cy="163" r="7" fill="#047857" />
  </g>

  <!-- Unit 2: Middle Server Rack (Active/Highlighted) -->
  <g filter="url(#shadow)">
    <rect x="110" y="212" width="292" height="66" rx="14" fill="#f0fdf4" stroke="#ffffff" stroke-width="3" />
    <line x1="138" y1="236" x2="240" y2="236" stroke="#059669" stroke-width="5" stroke-linecap="round" />
    <line x1="138" y1="254" x2="195" y2="254" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <circle cx="320" cy="245" r="7" fill="#10b981" filter="url(#glow)" />
    <circle cx="345" cy="245" r="7" fill="#059669" filter="url(#glow)" />
    <circle cx="372" cy="245" r="7" fill="#f59e0b" />
  </g>

  <!-- Bottom Switch Hub & Distribution Nodes -->
  <g filter="url(#shadow)">
    <rect x="166" y="302" width="180" height="42" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.5" />
    <!-- Switch Ports -->
    <rect x="185" y="316" width="14" height="14" rx="3" fill="#10b981" />
    <rect x="213" y="316" width="14" height="14" rx="3" fill="#10b981" />
    <rect x="241" y="316" width="14" height="14" rx="3" fill="#059669" />
    <rect x="269" y="316" width="14" height="14" rx="3" fill="#10b981" />
    <rect x="297" y="316" width="14" height="14" rx="3" fill="#f59e0b" />
  </g>

  <!-- Network Topology Connecting lines -->
  <path d="M 195 344 L 140 405 M 256 344 L 256 415 M 317 344 L 372 405" 
        stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Endpoint Client Nodes -->
  <g filter="url(#shadow)">
    <!-- Node Left -->
    <circle cx="140" cy="405" r="17" fill="#ffffff" stroke="#10b981" stroke-width="4" />
    <circle cx="140" cy="405" r="7" fill="#059669" />

    <!-- Node Center (Main IP Gateway) -->
    <circle cx="256" cy="415" r="22" fill="#ffffff" stroke="#059669" stroke-width="5" />
    <circle cx="256" cy="415" r="9" fill="#10b981" />

    <!-- Node Right -->
    <circle cx="372" cy="405" r="17" fill="#ffffff" stroke="#10b981" stroke-width="4" />
    <circle cx="372" cy="405" r="7" fill="#059669" />
  </g>

  <!-- Glowing Top Badge: DNS Network Globe -->
  <g transform="translate(256, 85)" filter="url(#glow)">
    <circle cx="0" cy="0" r="23" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#059669" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="8" ry="20" fill="none" stroke="#059669" stroke-width="2" />
    <circle cx="0" cy="0" r="4.5" fill="#10b981" />
  </g>
</svg>
